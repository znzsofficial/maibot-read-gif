name: Tests and source package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gif-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    name: runtime (${{ matrix.case }})
    if: github.repository == 'RoselindLabs/maibot-read-gif'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: linux-production, os: ubuntu-24.04, python: '3.14.4'}
          - {case: windows-minimum, os: windows-latest, python: '3.12'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual SDK and dependencies
        run: python -m pip install "maibot-plugin-sdk==2.20.0" "Pillow>=10,<13" "ruff==0.15.11"
      - run: python -m pip check
      - name: Run tests
        run: python scripts/check.py
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Verify source package
        run: python scripts/package.py
  ci-gate:
    if: always()
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: python -c "assert '${{ needs.tests.result }}' == 'success', 'Runtime tests/package did not pass'"
  publish-gate:
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: python -c "assert '${{ needs.tests.result }}' == 'success', 'Exact-commit runtime proof missing'"
